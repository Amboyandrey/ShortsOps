name: shortsops
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0B0F14"
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 24
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#0B0F14"
    theme_color: "#10B981"
