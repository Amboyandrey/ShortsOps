[project]
name = "shortsops-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Amboyandrey", email = "andreyamboy13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "supabase>=2",
    "watchdog>=6",
]

[project.scripts]
shortsops-agent = "shortsops_agent:main"

[build-system]
requires = ["uv_build>=0.8.10,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
